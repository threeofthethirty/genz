name: Sync SKILL.md and rules

on:
  push:
    branches: [main]
    paths:
      - skills/genz/SKILL.md
      - skills/genz-compress/SKILL.md
      - skills/genz-compress/scripts/**

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest before making changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Sync SKILL.md copies
        run: |
          cp skills/genz/SKILL.md plugins/genz/skills/genz/SKILL.md

      - name: Sync genz-compress skill to plugin
        run: |
          # Plugin distribution mirrors source verbatim — no rename, no sed.
          mkdir -p plugins/genz/skills/genz-compress
          cp skills/genz-compress/SKILL.md plugins/genz/skills/genz-compress/SKILL.md
          rm -rf plugins/genz/skills/genz-compress/scripts
          cp -r skills/genz-compress/scripts plugins/genz/skills/genz-compress/scripts
          rm -rf plugins/genz/skills/genz-compress/scripts/__pycache__

      - name: Rebuild genz.skill ZIP
        run: mkdir -p dist && cd skills && zip -r ../dist/genz.skill genz/

      - name: Commit and push if changed
        run: |
          git add \
            skills/genz-compress/ \
            plugins/genz/skills/genz-compress/ \
            plugins/genz/skills/genz/SKILL.md \
            dist/genz.skill
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync SKILL.md copies [skip ci]"
          git push
